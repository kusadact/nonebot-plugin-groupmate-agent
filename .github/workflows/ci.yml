name: CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - ".github/workflows/**"
      - "src/nonebot_plugin_groupmate_agent/**"
      - "scripts/**"
      - "tests/**"
      - "codecov.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/nonebot_plugin_groupmate_agent/**"
      - "scripts/**"
      - "tests/**"
      - "codecov.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run ruff check . --select E9,F63,F7,F82

      - name: Test
        run: uv run pytest

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          name: python-3.13
          fail_ci_if_error: true

      - name: Compile
        run: uv run python -m compileall -q src/nonebot_plugin_groupmate_agent scripts

      - name: Build package
        run: uv build
